name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost" --health-interval 2s --health-retries 60
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Coding standards
        run: composer lint

      - name: Install the WordPress test library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq subversion
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Install WooCommerce for the integration tests
        run: |
          curl -sSL -o /tmp/woocommerce.zip https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip
          unzip -o -q /tmp/woocommerce.zip -d /tmp/wordpress/wp-content/plugins/

      - name: Tests
        run: composer test
